query ArchivedEventsLite_Query(
  $clubId: ID!
  $first: Int!
  $after: String
) {
  club(id: $clubId) {
    id
    name
    archivedFeed(first: $first, after: $after) {
      edges {
        node {
          __typename
          ... on Event {
            id
            name
            address
            location
            coverPhotoUrl
            eventTime
            eventEndTime
            campfireLiveEventId
            discordChannelId
            clubId
            creator {
              id
              username
              displayName
            }
          }
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
