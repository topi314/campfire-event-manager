query ClubMembersQuery($clubId: ID!, $first: Int!, $after: String) {
  club(id: $clubId) {
    id
    members(first: $first, after: $after) {
      edges {
        node {
          id
          username
          displayName
          avatarUrl
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
